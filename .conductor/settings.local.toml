"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = 'source "$HOME/.nvm/nvm.sh" && nvm use --silent && npm install'
archive = "true"
run_mode = "concurrent"

[scripts.run.dev]
command = 'source "$HOME/.nvm/nvm.sh" && nvm use --silent && npm run dev -- --port "$CONDUCTOR_PORT"'
default = true
icon = "play"

[scripts.run.test]
command = 'source "$HOME/.nvm/nvm.sh" && nvm use --silent && npm run test:watch'
icon = "test-tube"
