            - listitem [ref=e139]:
              - strong [ref=e140]: "Data Retention:"
              - text: I configure provider-level retention to keep analytics and diagnostics data only as long as needed, then delete or aggregate it. See provider-specific retention above. You can request deletion at any time (see Your Privacy Rights).
            - listitem [ref=e141]:
              - strong [ref=e142]: "International Transfers:"
              - text: Data is processed in the United States under appropriate safeguards (e.g., SCCs) where required.
            - listitem [ref=e143]:
              - strong [ref=e144]: "Data sharing/sale:"
              - text: Data is not sold. Providers process data on my behalf to improve the app.
