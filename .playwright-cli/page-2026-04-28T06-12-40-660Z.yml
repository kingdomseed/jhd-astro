        - article [ref=e53]:
          - paragraph [ref=e54]:
            - strong [ref=e55]: Jason Holt Digital LLC
            - text: is the data controller for both Mythic GME Mobile and Mythic GME Digital. For any privacy questions reach me at
            - link "privacy@jasonholtdigital.com" [ref=e56] [cursor=pointer]:
              - /url: mailto:privacy@jasonholtdigital.com
            - text: .
          - heading "What Apps This Covers" [level=2] [ref=e57]
          - paragraph [ref=e58]: "This privacy policy applies to:"
          - list [ref=e59]:
            - listitem [ref=e60]:
              - strong [ref=e61]: Mythic GME Mobile
              - text: — iOS, Android, macOS, and Web versions
            - listitem [ref=e62]:
              - strong [ref=e63]: Mythic GME Digital
              - text: — Windows, macOS, and Linux desktop versions
          - heading "What Data I Actually Collect" [level=2] [ref=e64]
          - paragraph [ref=e65]: "I collect minimal data, and only what's necessary to make the apps work better. Here's exactly what I collect by platform:"
          - heading "Mobile Platforms (iOS, Android, macOS, Web)" [level=3] [ref=e66]
          - list [ref=e67]:
            - listitem [ref=e68]:
              - strong [ref=e69]: "Analytics (opt‑in):"
              - text: PostHog and Firebase capture app usage such as screen views, feature interactions, and events like dice rolls, table searches, list actions, settings changes, and support actions.
            - listitem [ref=e70]:
              - strong [ref=e71]: "Technical data:"
              - text: app_version, platform, locale, build_channel, and current_screen; a pseudonymous per‑install identifier (PostHog distinct_id).
            - listitem [ref=e72]:
              - strong [ref=e73]: "Context hashes:"
              - text: hashed IDs for journal, scene, table, and list context (SHA‑256 with a per‑install salt). No raw journal, scene, or table content is sent.
            - listitem [ref=e74]:
              - strong [ref=e75]: "Derived metrics only:"
              - text: e.g., content length buckets, expression complexity flags, counts. We do not send your actual notes or journal text.
            - listitem [ref=e76]:
              - strong [ref=e77]: "Crashes & errors (opt‑in):"
              - text: Sentry captures crash/error reports and session replays (screen capture) to help debug issues. Text content is obfuscated/redacted, including static UI labels.
            - listitem [ref=e78]:
              - strong [ref=e79]: "Country/region inference:"
              - text: Providers may infer rough location (e.g., country) from IP for product localization; precise GPS location is not collected.
          - heading "Desktop Platforms (Windows, Linux)" [level=3] [ref=e80]
          - list [ref=e81]:
            - listitem [ref=e82]:
              - strong [ref=e83]: "Analytics (opt‑in):"
              - text: Similar pseudonymous usage analytics as mobile when enabled.
            - listitem [ref=e84]:
              - strong [ref=e85]: "No advertising IDs:"
              - text: Desktop builds do not use mobile advertising identifiers.
            - listitem [ref=e86]:
              - strong [ref=e87]: "Local‑first:"
              - text: Journals, scenes, and custom tables remain on your device unless you export/share them.
          - heading "What I DON'T Collect" [level=3] [ref=e88]
          - list [ref=e89]:
            - listitem [ref=e90]: Personal information (name, email, phone number)
            - listitem [ref=e91]: Precise location data (GPS coordinates, exact address)
            - listitem [ref=e92]: Your game content or journal entries
            - listitem [ref=e93]: Browsing history outside the app
            - listitem [ref=e94]: Photos, videos, or personal files
            - listitem [ref=e95]: Social media connections
          - heading "Your Analytics Choice" [level=2] [ref=e96]
          - paragraph [ref=e97]:
            - text: When you first open the app, you'll see a consent dialog that explains analytics and lets you choose.
            - strong [ref=e98]: Analytics is off by default
            - text: until you opt in.
            - strong [ref=e99]: Crash and error reporting
            - text: is
            - strong [ref=e100]: on by default
            - text: to help diagnose issues and keep the app stable.
            - strong [ref=e101]: Session Replay
            - text: "is treated separately as described below. You can:"
          - list [ref=e102]:
            - listitem [ref=e103]: Enable or disable analytics any time in Settings (controls PostHog and Firebase).
            - listitem [ref=e104]: Disable crash/error reporting any time in Settings.
            - listitem [ref=e105]:
              - strong [ref=e106]: "v1.5.3 and later:"
              - text: Enable or disable Session Replay any time in Settings. Replay sampling and upload follow your preference (off unless you turn it on).
            - listitem [ref=e107]:
              - strong [ref=e108]: "Prior versions:"
              - text: On‑error Session Replay may be on by default; you can disable it in Settings.
            - listitem [ref=e109]: Keep using all app features even if analytics are off and/or crash reporting is disabled.
          - heading "I Don't Sell Your Data. Ever." [level=2] [ref=e110]
          - paragraph [ref=e111]: I don't sell your data. I won't sell your data. There's no business model here that involves selling data. The only scenario where your data might be "sold" is if I ever sold the entire business, and your data transferred with it as part of the app's functionality. But I'm not selling data to advertisers, data brokers, or anyone else.
          - heading "How Your Data is Processed" [level=2] [ref=e112]
          - heading "Analytics & Diagnostics Providers" [level=3] [ref=e113]
          - list [ref=e114]:
            - listitem [ref=e115]:
              - strong [ref=e116]: PostHog
              - text: "(product analytics): collects pseudonymous usage events and properties listed above."
              - emphasis [ref=e117]: Session replay is not enabled
              - text: "in PostHog at this time. Data is encrypted in transit. Region: United States."
              - strong [ref=e118]: "Retention (Cloud, paid):"
              - text: events retained up to
              - strong [ref=e119]: 7 years
              - text: ; session replay recordings retained for
