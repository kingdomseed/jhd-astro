              - emphasis [ref=e135]: Earlier versions
              - text: "may have on‑error replays on by default; you can disable them in Settings. Region: United States. By default, Sentry SDKs mask all text and images in replays and do not record any sessions unless sampling is explicitly enabled."
              - strong [ref=e136]: "Retention:"
              - text: Sentry retains event data according to your subscription plan's retention window and deletes regular backups after
              - strong [ref=e137]: 90 days
