              - text: .
            - listitem [ref=e131]:
              - strong [ref=e132]: Sentry
              - text: "(crash/error reporting + session replay): captures error details and short session replays to diagnose issues; text on screen is obfuscated/redacted and not readable. No keystrokes are captured. Crash/error reporting is enabled by default and can be disabled in Settings."
              - strong [ref=e133]: Session Replay
              - text: ":"
