          - heading "Local Storage" [level=3] [ref=e158]
          - list [ref=e159]:
            - listitem [ref=e160]:
              - strong [ref=e161]: "Game Data:"
              - text: All your journals, custom tables, and game content stay on your device
            - listitem [ref=e162]:
              - strong [ref=e163]: "File Access:"
              - text: I only access files you explicitly import/export (JSON for journals, Markdown for exports)
            - listitem [ref=e164]:
              - strong [ref=e165]: "iCloud Sync:"
              - text: If enabled, your game data syncs through Apple's secure iCloud service
            - listitem [ref=e166]:
              - strong [ref=e167]: "No Server Storage:"
              - text: Your game content never gets uploaded to my servers
          - heading "Legal Basis (GDPR)" [level=3] [ref=e168]
          - paragraph [ref=e169]: "For users in the EU, my legal basis for processing is:"
          - list [ref=e170]:
            - listitem [ref=e171]:
              - strong [ref=e172]: "Consent (Art. 6(1)(a)):"
              - text: Analytics runs only if you opt in; you can withdraw consent any time in Settings.
            - listitem [ref=e173]:
              - strong [ref=e174]: "Legitimate interests (Art. 6(1)(f)):"
              - text: Crash/error reporting (including on‑error session replay) to maintain security and stability; and responding to support emails you send. You can disable crash/error reporting in Settings.
          - heading "Do Not Sell or Share My Personal Information" [level=2] [ref=e175]
          - paragraph [ref=e176]:
            - text: I do not sell or share your personal information as defined by the CCPA/CPRA. If you still wish to submit a request regarding "Do Not Sell or Share," email
            - strong [ref=e177]: privacy@jasonholtdigital.com
            - text: . I will confirm that no sale or sharing occurs and honor any applicable rights.
          - heading "Your Privacy Rights" [level=2] [ref=e178]
          - paragraph [ref=e179]: "No matter where you live, you have important rights regarding your data:"
          - heading "Universal Rights" [level=3] [ref=e180]
          - list [ref=e181]:
            - listitem [ref=e182]:
              - strong [ref=e183]: "Know:"
              - text: What data I collect and why (it's all in this policy)
            - listitem [ref=e184]:
              - strong [ref=e185]: "Access:"
              - text: Request a copy of any data I have about you
            - listitem [ref=e186]:
              - strong [ref=e187]: "Correct:"
              - text: Fix any incorrect information
            - listitem [ref=e188]:
              - strong [ref=e189]: "Delete:"
              - text: Request deletion of your data
            - listitem [ref=e190]:
              - strong [ref=e191]: "Control:"
              - text: Turn analytics on/off anytime in app settings
            - listitem [ref=e192]:
              - strong [ref=e193]: "Export:"
              - text: Get your game data in portable formats
          - heading "Regional Privacy Laws" [level=3] [ref=e194]
          - paragraph [ref=e195]: "If you live in certain regions, you have additional rights:"
          - heading "European Union (GDPR)" [level=4] [ref=e196]
          - list [ref=e197]:
            - listitem [ref=e198]: Withdraw consent for analytics processing
            - listitem [ref=e199]: Object to data processing based on legitimate interests
            - listitem [ref=e200]: Request restriction of processing
            - listitem [ref=e201]: File complaints with your local data protection authority
          - heading "California (CCPA/CPRA)" [level=4] [ref=e202]
          - list [ref=e203]:
            - listitem [ref=e204]: Detailed disclosure of data collection practices
            - listitem [ref=e205]: Right to opt-out of data "sales" (though I don't sell data)
            - listitem [ref=e206]: Non-discrimination for exercising privacy rights
            - listitem [ref=e207]: Right to limit use of sensitive personal information
          - heading "Virginia, Colorado, Connecticut (State Privacy Laws)" [level=4] [ref=e208]
          - list [ref=e209]:
            - listitem [ref=e210]: Confirm what personal data I process
            - listitem [ref=e211]: Access, correct, delete, or port your data
            - listitem [ref=e212]: Opt-out of targeted advertising (not applicable since I don't do this)
          - heading "Brazil (LGPD)" [level=4] [ref=e213]
          - list [ref=e214]:
            - listitem [ref=e215]: Confirmation of data processing activities
            - listitem [ref=e216]: Access, correction, and deletion of personal data
            - listitem [ref=e217]: Data portability between services
            - listitem [ref=e218]: Information about data sharing (which I don't do)
          - heading "How to Exercise Your Rights" [level=3] [ref=e219]
          - paragraph [ref=e220]:
            - text: Email me at
            - strong [ref=e221]:
              - link "privacy@jasonholtdigital.com" [ref=e222] [cursor=pointer]:
                - /url: mailto:privacy@jasonholtdigital.com
            - text: "with your request. I'll respond within:"
          - list [ref=e223]:
            - listitem [ref=e224]:
              - strong [ref=e225]: "GDPR:"
              - text: 30 days
            - listitem [ref=e226]:
              - strong [ref=e227]: "CCPA:"
              - text: 45 days
            - listitem [ref=e228]:
              - strong [ref=e229]: "Other laws:"
              - text: 30–45 days
            - listitem [ref=e230]:
              - strong [ref=e231]: "General requests:"
              - text: 2 business days for acknowledgment
          - paragraph [ref=e232]:
            - strong [ref=e233]: "For your local game data:"
            - text: You already have full control. Export your journals before uninstalling if you want to keep them.
          - heading "Privacy Controls" [level=2] [ref=e234]
          - heading "In‑App Controls" [level=3] [ref=e235]
          - list [ref=e236]:
            - listitem [ref=e237]:
              - strong [ref=e238]: "Settings → Analytics:"
              - text: Toggle analytics (PostHog/Firebase) on/off
            - listitem [ref=e239]:
              - strong [ref=e240]: "Settings → Diagnostics:"
              - list [ref=e241]:
                - listitem [ref=e242]:
                  - strong [ref=e243]: "Crash & Error Reporting:"
                  - text: On/Off (on by default)
                - listitem [ref=e244]:
                  - strong [ref=e245]: "Session Replay (v1.5.3+):"
                  - text: On/Off (off by default)
            - listitem [ref=e246]:
              - strong [ref=e247]: "First‑Run Dialog:"
              - text: Choose your analytics preference when you first open the app
            - listitem [ref=e248]:
              - strong [ref=e249]: "Export Data:"
              - text: Export your game journals as JSON or Markdown files
            - listitem [ref=e250]:
              - strong [ref=e251]: "Delete Data:"
              - text: Clear all app data or uninstall to remove everything
          - heading "Device‑Level Controls" [level=3] [ref=e252]
          - heading "iOS/iPadOS" [level=4] [ref=e253]
          - list [ref=e254]:
            - listitem [ref=e255]:
              - strong [ref=e256]: "App Analytics:"
              - text: Settings → Privacy → Analytics & Improvements → Share App Analytics
            - listitem [ref=e257]:
              - strong [ref=e258]: "App Permissions:"
              - text: Settings → Privacy → Files and Folders → Mythic GME
            - listitem [ref=e259]:
              - strong [ref=e260]: "App Tracking:"
              - text: Settings → Privacy → Tracking (though I don't track across apps)
          - heading "Android" [level=4] [ref=e261]
          - list [ref=e262]:
            - listitem [ref=e263]:
              - strong [ref=e264]: "App Permissions:"
              - text: Settings → Apps → Mythic GME Mobile → Permissions
            - listitem [ref=e265]:
              - strong [ref=e266]: "Usage Data:"
              - text: Settings → Google → Usage & Diagnostics
            - listitem [ref=e267]:
              - strong [ref=e268]: "Advertising:"
              - text: Settings → Google → Ads (though I don't use ads)
          - heading "Desktop (Windows/macOS/Linux)" [level=4] [ref=e269]
          - list [ref=e270]:
            - listitem [ref=e271]:
              - strong [ref=e272]: "Limited Analytics:"
              - text: Most device‑level controls don't apply
            - listitem [ref=e273]:
              - strong [ref=e274]: "File Access:"
              - text: Desktop versions only access files you explicitly open/save
            - listitem [ref=e275]:
              - strong [ref=e276]: "System Privacy:"
              - text: Standard OS privacy controls apply
          - heading "Platform Differences" [level=2] [ref=e277]
          - heading "Why Desktop Has Limited Analytics" [level=3] [ref=e278]
          - list [ref=e279]:
            - listitem [ref=e280]:
              - strong [ref=e281]: "Windows/Linux:"
              - text: Firebase and PostHog have limited functionality on these platforms
            - listitem [ref=e282]:
              - strong [ref=e283]: "macOS Desktop:"
              - text: Some analytics work, but less comprehensive than mobile
            - listitem [ref=e284]:
              - strong [ref=e285]: "Technical Limitations:"
              - text: Desktop platforms don't support many mobile analytics features
            - listitem [ref=e286]:
              - strong [ref=e287]: "Privacy by Design:"
              - text: Less data collection means better privacy
          - heading "Children's Privacy" [level=2] [ref=e288]
          - paragraph [ref=e289]: Mythic GME is designed for tabletop RPG players, who are typically adults. The apps are not intended for children under 13. Users must be at least 16 to consent to analytics processing in the EU, or have parent/guardian consent where applicable.
          - paragraph [ref=e290]:
            - text: If you believe a child has used the app and analytics were enabled, please email
            - link "privacy@jasonholtdigital.com" [ref=e291] [cursor=pointer]:
              - /url: mailto:privacy@jasonholtdigital.com
            - text: immediately.
          - heading "Changes to This Policy" [level=2] [ref=e292]
          - paragraph [ref=e293]: "When I update this privacy policy:"
          - list [ref=e294]:
            - listitem [ref=e295]: The "Last Updated" date will change
            - listitem [ref=e296]: Major changes will be announced in the app
            - listitem [ref=e297]: You'll see the consent dialog again if analytics practices change significantly
            - listitem [ref=e298]: Continued use after changes means you accept the updated policy
          - heading "Future Features" [level=2] [ref=e299]
          - paragraph [ref=e300]: "If I ever add cloud save functionality or other features that change data handling:"
          - list [ref=e301]:
            - listitem [ref=e302]: This policy will be updated first
            - listitem [ref=e303]: You'll be notified of changes
            - listitem [ref=e304]: New features will have their own privacy controls
            - listitem [ref=e305]: Existing privacy settings won't change without your consent
          - heading "Contact Me" [level=2] [ref=e306]
          - paragraph [ref=e307]: "For any privacy questions, concerns, or requests:"
          - list [ref=e308]:
            - listitem [ref=e309]:
              - strong [ref=e310]: "Email:"
              - link "privacy@jasonholtdigital.com" [ref=e311] [cursor=pointer]:
                - /url: mailto:privacy@jasonholtdigital.com
              - text: (fastest response)
            - listitem [ref=e312]:
              - strong [ref=e313]: "Mail:"
              - text: Jason Holt Digital LLC, 1111b S Governors Avenue STE 21904, Dover, DE 19904 US
            - listitem [ref=e314]:
              - strong [ref=e315]: "Response Time:"
              - text: Within 2 business days for acknowledgment
          - paragraph [ref=e316]: I personally read and respond to every privacy-related email. If you have concerns, questions, or suggestions about how I handle privacy, please reach out.
          - heading "App Store Compliance" [level=2] [ref=e317]
          - heading "Google Play Data Safety" [level=3] [ref=e318]
          - paragraph [ref=e319]: "This privacy policy supports Google Play Data Safety requirements by disclosing:"
          - list [ref=e320]:
            - listitem [ref=e321]:
              - strong [ref=e322]: "Data collected:"
              - text: App activity (feature interactions, screen views), App info & performance (diagnostics where applicable), and Device or other IDs (pseudonymous per‑install ID). No personal or precise location data is collected.
            - listitem [ref=e323]:
              - strong [ref=e324]: "Purposes:"
              - text: Product analytics and app functionality; no advertising.
            - listitem [ref=e325]:
              - strong [ref=e326]: "Data sharing:"
              - text: Only with analytics providers (Firebase, PostHog) for processing on my behalf. Data is not sold.
            - listitem [ref=e327]:
              - strong [ref=e328]: "Security practices:"
              - text: Data encrypted in transit; minimal collection.
            - listitem [ref=e329]:
              - strong [ref=e330]: "User controls:"
              - text: Analytics is optional and controlled by an in‑app toggle.
          - heading "Apple Privacy Nutrition Labels" [level=3] [ref=e331]
          - paragraph [ref=e332]: "For App Store compliance, this policy supports Apple's Privacy Nutrition Label requirements:"
          - list [ref=e333]:
            - listitem [ref=e334]:
              - strong [ref=e335]: "Data not linked to you:"
              - text: Usage Data (App Interactions, Screen Views) and Diagnostics (including crash reports and session replays with text redaction) where applicable.
            - listitem [ref=e336]:
              - strong [ref=e337]: "Tracking across apps/websites:"
