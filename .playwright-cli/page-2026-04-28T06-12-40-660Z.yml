              - text: by default (1 month on free). Some replays may be retained for up to
              - strong [ref=e121]: 1 year
              - text: "if pinned to a playlist, shared publicly, or added to a notebook. Sources:"
              - link "Privacy Policy" [ref=e122] [cursor=pointer]:
                - /url: https://posthog.com/privacy
