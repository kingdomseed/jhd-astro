          - generic [ref=e58]:
            - paragraph [ref=e59]: "Welcome! This quick guide is based on the app itself: you start at the Fate Chart and move between Lists, Scenes, and Meaning Tables as you play. There are no accounts or servers—everything happens on your device."
            - blockquote [ref=e60]:
              - paragraph [ref=e61]: "What you need: Bring these to the table"
              - list [ref=e62]:
                - listitem [ref=e63]: Your favorite RPG and character(s) created (keep sheets handy)
                - listitem [ref=e64]: The Mythic GME 2e book for odds and rules context
                - listitem [ref=e65]: The desktop or mobile app installed
            - heading "Before you begin" [level=2] [ref=e66]
            - list [ref=e67]:
              - listitem [ref=e68]:
                - text: A copy of the
                - link "Mythic Game Master Emulator 2e book" [ref=e69] [cursor=pointer]:
                  - /url: https://www.drivethrurpg.com/en/product/422929/mythic-game-master-emulator-second-edition
                - text: (Word Mill Creative) for rules context and guidance
              - listitem [ref=e70]: Your favorite RPG system and character(s) created and ready to play
              - listitem [ref=e71]: The desktop or mobile version of the app
            - heading "Core steps" [level=2] [ref=e72]
            - heading "1) Install" [level=3] [ref=e73]
            - paragraph [ref=e74]: Install the desktop app or the mobile app from your platform’s store and launch it. Once launched, the app automatically creates your first journal for you called ‘My Journal’. You can rename this in settings.
            - heading "2) Start at the Fate Chart (or switch to Fate Check)" [level=3] [ref=e75]
            - paragraph [ref=e76]: On first launch, the app opens to the Fate Chart. You can switch the default to Fate Check in Settings later if you prefer. Set your Chaos Factor, choose odds, and roll. The app highlights Yes/No/Exceptional results clearly.
            - blockquote [ref=e77]:
              - paragraph [ref=e78]: "Tip: Change A Screens Settings"
              - list [ref=e79]:
                - listitem [ref=e80]: There’s a settings wheel that let’s you change the settings for each screen.
                - listitem [ref=e81]: You can enable more details about rolls on the Fate Chart screen
                - listitem [ref=e82]: You can also turn on the ability to ask a question before each roll
            - heading "3) Core screens you’ll use every session" [level=3] [ref=e83]
            - list [ref=e84]:
              - listitem [ref=e85]: "Fate Chart (and Fate Check): ask questions, choose odds, roll, and interpret answers."
              - listitem [ref=e86]: "Lists: track Characters, Threads, and Features. These lists feed your event rolls and bring elements into your story in unexpected ways."
              - listitem [ref=e87]: "Scenes: jot a title and summary; snapshot the Chaos Factor for the scene start; add notes as you play or wait until the conclusion of a scene and summerize."
              - listitem [ref=e88]: "Meaning Tables: Action/Subject and other tables for giving you the inspiration to interpret your results."
            - paragraph [ref=e89]: Layout notes
            - list [ref=e90]:
              - listitem [ref=e91]: "Mobile: each area is its own screen; switch using the navigation drawer on the top left."
              - listitem [ref=e92]: "Desktop: all core areas are visible together so you can roll and write without switching."
            - heading "4) A simple first session flow" [level=3] [ref=e93]
            - list [ref=e94]:
              - listitem [ref=e95]: Set Chaos Factor (CF) in the Fate Chart
              - listitem [ref=e96]: Create a Scene with a short summary; record the scene’s starting CF
              - listitem [ref=e97]: Begin the scene by asking your first yes/no Fate question in the Fate Chart and roll
              - listitem [ref=e98]: If you get stuck, roll on Meaning Tables for inspiration
              - listitem [ref=e99]: Add items to Lists (Characters, Threads, Features) as they emerge
              - listitem [ref=e100]: Adjust CF between scenes as your story shifts
            - heading "Tips & troubleshooting" [level=2] [ref=e101]
            - list [ref=e102]:
              - listitem [ref=e103]: Unsure about how to start? Keep the book nearby and start with likely/50‑50 early on
              - listitem [ref=e104]: Chaos factor determines how likely exceptional results occur
              - listitem [ref=e105]: On mobile, try landscape when you want more context while playing
            - heading "Next steps" [level=2] [ref=e106]
            - list [ref=e107]:
              - listitem [ref=e108]: "Learn formulas and per‑system starters: “Dice Formulas & Customization”"
              - listitem [ref=e109]: "Build custom tables (optional feature): “Getting Started with Custom Tables”"
              - listitem [ref=e110]: "Share and safeguard journals: “Sharing Adventure Journals”"
          - region "Step-by-step" [ref=e111]:
            - heading "Step-by-step" [level=2] [ref=e112]
            - list [ref=e113]:
              - listitem [ref=e114]:
                - heading "Install on your device(s)" [level=3] [ref=e115]
                - paragraph [ref=e116]: Download and install the desktop or mobile app and launch--the app creates your first saved game--My Journal. Rename it on the settings screen.
              - listitem [ref=e117]:
                - heading "Set your Chaos Factor" [level=3] [ref=e118]
                - paragraph [ref=e119]: On first launch you’ll see the Fate Chart. Set CF (1–9) to match your scenario; adjust later as needed.
              - listitem [ref=e120]:
                - heading "Ask, roll, and record" [level=3] [ref=e121]
                - paragraph [ref=e122]: Type a yes/no question, pick odds, and roll. Record outcomes in your scene notes to keep story continuity. You can enable writing your question before the role on the screen settings.
              - listitem [ref=e123]:
                - heading "Use Lists, Scenes, and Meaning Tables" [level=3] [ref=e124]
                - paragraph [ref=e125]: It's a good idea to add Characters and Threads to your Lists before starting your first game. Use Scenes to summerize or predict, and meaning tables for interpreting outcomes.
