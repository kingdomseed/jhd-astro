          - heading "v1.6.0 Preview — Progress Tracks, Discovery Checks & Keyed Scenes" [level=1] [ref=e39]
          - paragraph [ref=e40]: "Coming soon: three new Mythic GME 2e systems — track thread progress with visual bars, run oracle-style Discovery Checks, and set up triggered Keyed Scenes — all in a new tabbed Game Panel."
          - list "Post details" [ref=e41]:
            - listitem [ref=e42]: Mar 25, 2026
