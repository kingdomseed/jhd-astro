    - generic [ref=e49]:
      - article [ref=e50]:
        - generic [ref=e51]:
          - paragraph [ref=e52]:
            - link "Back to blog" [ref=e53] [cursor=pointer]:
              - /url: /v2/blog/
              - generic [ref=e54]: 
              - text: Back to blog
          - generic [ref=e55]:
            - paragraph [ref=e56]: Coming soon
            - paragraph [ref=e57]: "This is the biggest feature release since the app launched. Three systems from the Mythic GME 2e rules that players have been requesting — Progress Tracks, Discovery Checks, and Keyed Scenes — are all landing together. The Game Panel is getting a full redesign to hold them: a tabbed layout with Meaning Tables, Event Focus, Tracks, and Discovery each in their own tab."
            - paragraph [ref=e58]: Each one went through a few design iterations before I was happy with how they felt in play. Here’s what’s coming.
            - heading "Highlights" [level=2] [ref=e59]
            - list [ref=e60]:
              - listitem [ref=e61]:
                - strong [ref=e62]: Progress Tracks
                - text: ": Visual progress bars for tracking thread advancement. Set custom point ranges, mark Flashpoints in the Adventure Log, and watch the bar fill as the story moves forward. Controls use a two-tap “armed action” pattern — tap once to arm, tap again to confirm — so you don’t accidentally bump your progress."
              - listitem [ref=e63]:
                - strong [ref=e64]: Discovery Checks
                - text: ": A dedicated panel for the oracle-style Discovery Check mechanic. Roll, get an automated result summary, and (if you have Progress Tracks active) the result auto-applies to the right track. Localized across all 8 languages."
              - listitem [ref=e65]:
                - strong [ref=e66]: Keyed Scenes
                - text: ": Set up scene triggers that fire when conditions are met. Choose count-based targets with a visual stepper, pick one-shot (deactivates after trigger) or recurring (resets and stays active), and let the app auto-trigger when the count reaches the target. Triggered scenes get a badge and a dedicated log entry."
              - listitem [ref=e67]:
                - strong [ref=e68]: Tabbed Game Panel
                - text: ": The old single-panel view is gone. Meaning Tables, Event Focus, Tracks, and Discovery now live in their own tabs — less scrolling, faster switching."
            - heading "Added" [level=2] [ref=e69]
            - list [ref=e70]:
              - listitem [ref=e71]:
                - strong [ref=e72]: Progress Tracks
                - text: ": Thread progress tracking with visual progress bars, custom point ranges, and Flashpoint log entry support."
              - listitem [ref=e73]:
                - strong [ref=e74]: Discovery Checks
                - text: ": Dedicated Discovery Check panel with oracle-style outcomes, automated result summaries, and localized strings."
              - listitem [ref=e75]:
                - strong [ref=e76]: Keyed Scenes
                - text: ": Triggered scene badges, inline auto-increment toggles, count-based targets (one-shot and recurring), and dedicated game log builders."
              - listitem [ref=e77]:
                - strong [ref=e78]: Game Panel
                - text: ": Refactored into a tabbed layout housing Meaning Tables, Event Focus, Tracks, and Discovery."
              - listitem [ref=e79]:
                - strong [ref=e80]: Architecture
                - text: ": Lifecycle guards on all major notifiers (Journal, Table, Formula, Event Focus) to harden iCloud operations against app backgrounding."
            - heading "Changed" [level=2] [ref=e81]
            - list [ref=e82]:
              - listitem [ref=e83]: Updated Flutter SDK to 3.41.5 across all build tooling.
              - listitem [ref=e84]: Progress Track controls use +1/+2/+3 increments with a new FP (Focus Point) modifier button.
              - listitem [ref=e85]: Regenerated iOS Xcode project with updated CocoaPods references for build consistency.
