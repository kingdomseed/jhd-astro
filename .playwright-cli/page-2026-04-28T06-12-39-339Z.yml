    - region "Hi, I'm Jason." [ref=e34]:
      - generic [ref=e35]:
        - generic [ref=e36]:
          - paragraph [ref=e37]:
            - generic [ref=e38]: "01"
            - text: Teacher turned developer, building tools for the Mythic community
          - heading "Hi, I'm Jason." [level=1] [ref=e39]:
            - text: Hi, I'm
            - emphasis [ref=e40]: Jason
            - text: .
          - paragraph [ref=e41]: I build the official Mythic GME 2e apps with Word Mill Games. I got here through nine years of teaching, a lot of code, and a community that showed me what to build.
          - list "About highlights" [ref=e42]:
            - listitem [ref=e43]: Licensed with Word Mill Games
            - listitem [ref=e44]: Indie developer
            - listitem [ref=e45]: Computational linguistics student
        - figure "Hi, I'm Jason Founder, builder, and support inbox reader." [ref=e46]:
          - img "Jason Holt" [ref=e47]
          - generic [ref=e48]:
            - strong [ref=e49]: Hi, I'm Jason
            - text: Founder, builder, and support inbox reader.
    - region "I build tools for play that stays in motion." [ref=e50]:
      - generic [ref=e51]:
        - generic [ref=e52]:
          - paragraph [ref=e53]:
            - generic [ref=e54]: "02"
            - text: Profile
          - heading "I build tools for play that stays in motion." [level=2] [ref=e55]
        - generic [ref=e56]:
          - paragraph [ref=e57]: "I wrote my first program at twelve: a Redwall choose-your-own-adventure in Basic. Then nine years of teaching computer science, some Flutter experiments, and finally building a real app after dreaming about it since I ran Hour of Code with my students in 2013."
          - paragraph [ref=e58]:
            - text: "I maintain two products under license from Word Mill Games:"
            - strong [ref=e59]: Mythic GME Mobile
            - text: for iOS and Android, and
            - strong [ref=e60]: Mythic GME Digital
            - text: for Windows, macOS, and Linux.
          - paragraph [ref=e61]: "I'm also pursuing an M.Sc. in Computational Linguistics: part curiosity about how language and software can work together for solo play, and part the same pattern that has driven every fresh start in my career. Someone had a need, and I wanted to help meet it."
    - region "Licensed Mythic apps, shaped with the community." [ref=e62]:
      - generic [ref=e63]:
        - generic [ref=e64]:
          - paragraph [ref=e65]:
