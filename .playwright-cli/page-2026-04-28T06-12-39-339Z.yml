    - region "Small, frequent updates. Real support conversations." [ref=e94]:
      - generic [ref=e95]:
        - generic [ref=e96]:
          - paragraph [ref=e97]:
            - generic [ref=e98]: "04"
            - text: Approach
          - heading "Small, frequent updates. Real support conversations." [level=2] [ref=e99]
          - paragraph [ref=e100]: The work improves because players keep telling me where the table gets stuck.
        - list [ref=e101]:
          - listitem [ref=e102]:
            - generic [ref=e103]: 
            - heading "Educator roots" [level=3] [ref=e104]
            - paragraph [ref=e105]: Nine years of teaching computer science and digital design. I coached teams, explained complex things simply, and watched students build things I never would have thought of.
          - listitem [ref=e106]:
            - generic [ref=e107]: 
            - heading "Formed by service" [level=3] [ref=e108]
            - paragraph [ref=e109]: A two‑year practicum in leadership and service. Putting others first became a habit. It stuck.
          - listitem [ref=e110]:
            - generic [ref=e111]: 
            - heading "Community‑first" [level=3] [ref=e112]
            - paragraph [ref=e113]: Hundreds of Mythic players help me figure out what to fix, what to build, and what matters most. They shape the apps as much as I do.
          - listitem [ref=e114]:
            - generic [ref=e115]: 
            - heading "Mobile × NLP next" [level=3] [ref=e116]
            - paragraph [ref=e117]: Studying computational linguistics at Stuttgart. I'm curious about where language processing and solo RPG tools can meet — and what that might look like in the app.
