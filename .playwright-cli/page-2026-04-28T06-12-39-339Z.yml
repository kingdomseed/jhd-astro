            - text: Official
          - heading "Licensed Mythic apps, shaped with the community." [level=2] [ref=e67]
          - paragraph [ref=e68]: Less flipping through tables, more time in the story.
        - list [ref=e69]:
          - listitem [ref=e70]:
            - generic [ref=e71]: 
            - heading "One‑tap oracles" [level=3] [ref=e72]
