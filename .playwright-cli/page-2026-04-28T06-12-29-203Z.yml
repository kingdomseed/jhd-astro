          - heading "v1.6.0 Preview — Progress Tracks, Discovery Checks & Keyed Scenes" [level=1] [ref=e48]
          - paragraph [ref=e49]: "Coming soon: three new Mythic GME 2e systems — track thread progress with visual bars, run oracle-style Discovery Checks, and set up triggered Keyed Scenes — all in a new tabbed Game Panel."
          - list "Post details" [ref=e50]:
            - listitem [ref=e51]: Mar 25, 2026
            - listitem [ref=e52]: 5 min read
            - listitem [ref=e53]: Version notes, app changes, and what players can expect next.
        - complementary [ref=e54]:
          - strong [ref=e55]: Dispatch
          - paragraph [ref=e56]: Release notes, build notes, and behind-the-scenes writing from the Mythic table.
    - generic [ref=e58]:
      - article [ref=e59]:
        - generic [ref=e60]:
          - paragraph [ref=e61]:
            - link "Back to blog" [ref=e62] [cursor=pointer]:
              - /url: /v2/blog/
              - generic [ref=e63]: 
              - text: Back to blog
          - generic [ref=e64]:
            - paragraph [ref=e65]: Coming soon
            - paragraph [ref=e66]: "This is the biggest feature release since the app launched. Three systems from the Mythic GME 2e rules that players have been requesting — Progress Tracks, Discovery Checks, and Keyed Scenes — are all landing together. The Game Panel is getting a full redesign to hold them: a tabbed layout with Meaning Tables, Event Focus, Tracks, and Discovery each in their own tab."
            - paragraph [ref=e67]: Each one went through a few design iterations before I was happy with how they felt in play. Here’s what’s coming.
            - heading "Highlights" [level=2] [ref=e68]
            - list [ref=e69]:
              - listitem [ref=e70]:
                - strong [ref=e71]: Progress Tracks
                - text: ": Visual progress bars for tracking thread advancement. Set custom point ranges, mark Flashpoints in the Adventure Log, and watch the bar fill as the story moves forward. Controls use a two-tap “armed action” pattern — tap once to arm, tap again to confirm — so you don’t accidentally bump your progress."
              - listitem [ref=e72]:
                - strong [ref=e73]: Discovery Checks
                - text: ": A dedicated panel for the oracle-style Discovery Check mechanic. Roll, get an automated result summary, and (if you have Progress Tracks active) the result auto-applies to the right track. Localized across all 8 languages."
              - listitem [ref=e74]:
                - strong [ref=e75]: Keyed Scenes
                - text: ": Set up scene triggers that fire when conditions are met. Choose count-based targets with a visual stepper, pick one-shot (deactivates after trigger) or recurring (resets and stays active), and let the app auto-trigger when the count reaches the target. Triggered scenes get a badge and a dedicated log entry."
              - listitem [ref=e76]:
                - strong [ref=e77]: Tabbed Game Panel
                - text: ": The old single-panel view is gone. Meaning Tables, Event Focus, Tracks, and Discovery now live in their own tabs — less scrolling, faster switching."
            - heading "Added" [level=2] [ref=e78]
            - list [ref=e79]:
              - listitem [ref=e80]:
                - strong [ref=e81]: Progress Tracks
                - text: ": Thread progress tracking with visual progress bars, custom point ranges, and Flashpoint log entry support."
              - listitem [ref=e82]:
                - strong [ref=e83]: Discovery Checks
                - text: ": Dedicated Discovery Check panel with oracle-style outcomes, automated result summaries, and localized strings."
              - listitem [ref=e84]:
                - strong [ref=e85]: Keyed Scenes
                - text: ": Triggered scene badges, inline auto-increment toggles, count-based targets (one-shot and recurring), and dedicated game log builders."
              - listitem [ref=e86]:
                - strong [ref=e87]: Game Panel
                - text: ": Refactored into a tabbed layout housing Meaning Tables, Event Focus, Tracks, and Discovery."
              - listitem [ref=e88]:
                - strong [ref=e89]: Architecture
                - text: ": Lifecycle guards on all major notifiers (Journal, Table, Formula, Event Focus) to harden iCloud operations against app backgrounding."
            - heading "Changed" [level=2] [ref=e90]
            - list [ref=e91]:
              - listitem [ref=e92]: Updated Flutter SDK to 3.41.5 across all build tooling.
              - listitem [ref=e93]: Progress Track controls use +1/+2/+3 increments with a new FP (Focus Point) modifier button.
              - listitem [ref=e94]: Regenerated iOS Xcode project with updated CocoaPods references for build consistency.
